# Sent on every response. nginx drops inherited add_header lines in any block that has its
# own add_header, so blocks with extra headers include this file again.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# Empty (not sent) unless the client connection is HTTPS; see map $hsts.
add_header Strict-Transport-Security $hsts always;
